name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Static Site
        run: |
          mkdir -p _site/static/css _site/static/js _site/static/brand _site/static/vendor
          # Copy frontend root files (index.html)
          cp app/frontend/index.html _site/
          # Copy css, js, vendor into both root and static/ for bulletproof resolution
          cp -R app/frontend/css _site/
          cp -R app/frontend/js _site/
          cp -R app/frontend/vendor _site/
          cp -R app/frontend/css/* _site/static/css/
          cp -R app/frontend/js/* _site/static/js/
          cp -R app/frontend/vendor/* _site/static/vendor/
          # Copy brand assets into both root/brand and static/brand
          mkdir -p _site/brand
          cp -R app/static/brand/* _site/brand/
          cp -R app/static/brand/* _site/static/brand/
          # Disable Jekyll so hidden files and vendor aren't skipped
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
